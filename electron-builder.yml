appId: com.sankalpaacharya.editor
productName: Editor
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
directories:
  output: release
files:
  - out/**/*
  - package.json
afterPack: scripts/after-pack.cjs
asarUnpack:
  - node_modules/ffmpeg-static/**
extraResources:
  - from: resources/fonts
    to: fonts
  - from: resources/bin
    to: bin
mac:
  category: public.app-category.video
  target:
    - dmg
    - zip
win:
  target: nsis
linux:
  category: AudioVideo
  target: AppImage
publish:
  provider: github
  owner: sankalpaacharya
  repo: editor
